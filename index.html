<!DOCTYPE html>
<html>
  <head>
    <title>Your Giga Pet</title>
    <meta name="description" content="A cool thing made with Glitch">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>
        This is Niko your Giga Pet!
      </h1>
    </header>

    <main>
      <section class="pet-image-container">
         <!-- Niko seal -->
        <img class="pet-image" src="images/NikoPet.png" alt="Niko the seal">
      </section>

      <section class="dashboard">
        <div>Name: <strong><span class="name"></span></strong></div>
        <div>Weight: <strong><span class="weight"></span> pounds</strong></div>
        <div>Happiness: <strong><span class="happiness"></span> tail wags (per min)</strong></div>
        <div>Mood: <strong><span class="mood"></span></strong></div>
        <div class="stats">Actions used: <strong><span class="actions-count">0</span></strong></div>

        <div class="button-container">
          <button class="treat-button">
            Treat
          </button>
          <button class="play-button">
            Play
          </button>
          <button class="exercise-button">
            Exercise
          </button>
          <button class="rub-button">
            Belly Rub
          </button>
        </div>
        <div class="pet-message" aria-live="polite"></div>
          
      </section>
    </main>

    <!-- HW10 DevTools lab: buttons that trigger browser options -->
    <section class="debug-lab">
      <h2>DevTools Lab (HW10)</h2>
      <div class="debug-container">
        <button class="debug-404-button">Trigger 404</button>
        <button class="debug-typeerror-button">Trigger TypeError</button>
        <button class="debug-violation-button">Trigger Violation</button>
        <button class="debug-logs-button">Re-run Console Logs</button>
      </div>
    </section>

   
    <script src="https://code.jquery.com/jquery-2.2.1.min.js"
            integrity="sha256-gvQgAFzTH6trSrAWoH1iPo9Xc96QxSZ3feW6kem+O00="
            crossorigin="anonymous"></script>
  </body>
</html>
